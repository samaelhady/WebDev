<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Greeter</title>
  <style>
    :root {
      --bg: #eef2f7;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d9e6;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --danger: #f87171;
        --danger-bg: #3b1d24;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.6rem;
      line-height: 1.3;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 1rem;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    input::placeholder { color: var(--muted); }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 1px;
    }

    button {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.97); }

    ul {
      list-style: none;
      margin: 20px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    li:hover {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
      text-decoration: line-through;
    }

    ul:empty { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">Welcome</h1>
    <div class="row">
      <input id="name" placeholder="Your name" />
      <button id="greet">Greet</button>
    </div>
    <ul id="list"></ul>
  </main>

  <script>
    // Function to greet the user and add their name to the list
    function addName() {
      const input = document.getElementById('name');
      const name = input.value.trim();

      if (!name) return; // ignore empty input

      document.getElementById('title').textContent = `Hello, ${name}!`;

      const li = document.createElement('li');
      li.textContent = name;
      document.getElementById('list').appendChild(li);

      input.value = ''; // clear input box
    }

    // Function to say goodbye when a name is clicked
    function removeName(e) {
      if (e.target.nodeName === 'LI') {
        const name = e.target.textContent;
        document.getElementById('title').textContent = `Goodbye, ${name}! see you later.`;
        e.target.remove(); // remove the clicked <li>
      }
    }

    // Attach event listeners
    document.getElementById('greet').addEventListener('click', addName);
    document.getElementById('list').addEventListener('click', removeName);
  </script>
</body>
</html>
